    fallback: "Inter, Arial, sans-serif"
    status: approved
  mono_family: null
  weights:
    regular: 400
    medium: 500
    semibold: 600
    bold: 700
  scale:
    display_xl: {desktop: "56px", mobile: "40px", line_height: "1.14", family: "Lora", weight: 600, letter_spacing: "-0.02em"}
    display_lg: {desktop: "44px", mobile: "34px", line_height: "1.18", family: "Lora", weight: 600, letter_spacing: "-0.015em"}
    heading_1: {desktop: "40px", mobile: "32px", line_height: "1.2", family: "Lora", weight: 600, letter_spacing: "-0.01em"}
    heading_2: {desktop: "32px", mobile: "28px", line_height: "1.25", family: "Lora", weight: 600, letter_spacing: "-0.01em"}
    heading_3: {desktop: "24px", mobile: "24px", line_height: "1.33", family: "Lora", weight: 600, letter_spacing: "0"}
    heading_4: {desktop: "20px", mobile: "20px", line_height: "1.4", family: "Manrope", weight: 700, letter_spacing: "-0.005em"}
    body_lg: {desktop: "18px", mobile: "18px", line_height: "1.67", family: "Manrope", weight: 400, letter_spacing: "0"}
    body_md: {desktop: "16px", mobile: "16px", line_height: "1.625", family: "Manrope", weight: 400, letter_spacing: "0"}
    body_sm: {desktop: "14px", mobile: "14px", line_height: "1.57", family: "Manrope", weight: 400, letter_spacing: "0"}
    label: {desktop: "14px", mobile: "14px", line_height: "1.43", family: "Manrope", weight: 600, letter_spacing: "0.01em"}
    caption: {desktop: "12px", mobile: "12px", line_height: "1.5", family: "Manrope", weight: 500, letter_spacing: "0.01em"}
  line_heights: {display: "1.14–1.25", heading: "1.2–1.4", body: "1.57–1.67", label: "1.43–1.5"}
  letter_spacing: {display: "-0.02em to 0", body: "0", labels: "0.01em"}
  roles:
    editorial_display: "Lora 600"
    page_heading: "Lora 600"
    component_heading: "Manrope 700"
    body_and_ui: "Manrope 400"
    label: "Manrope 600"
    caption: "Manrope 500"
  usage_rules:
    - "Use Lora for public storytelling, page titles, section headings, and warm editorial moments."
    - "Use Manrope for navigation, forms, buttons, dashboards, tables, schedules, labels, and sustained body reading."
    - "Do not use the handwritten logo lettering as a general interface typeface."
    - "Avoid long passages set in Lora; operational clarity belongs to Manrope."

spacing:
