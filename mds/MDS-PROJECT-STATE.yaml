mds:
  system: Mercurius Design System
  schema_version: "1.1"
  project_id: "home-school-haven-learning-platform"
  project_name: "Home School Haven Learning Platform"
  lifecycle: active
  mds_version: "v1.1"
  current_gate: implementation_readiness
  mps_project_id: "home-school-haven-learning-platform"
  mps_version: "unversioned draft; Library version 11 consumed"
  created_at: "2026-08-27T00:00:00Z"
  updated_at: "2026-08-28T00:00:00Z"

project:
  name: "Home School Haven Learning Platform"
  description: "A connected Christ-centered ecosystem combining the public Home School Haven website with family, educator, and administrative experiences."
  product_type: "Responsive public website, program management portal, blended learning hub, and future online learning platform"
  audience:
    - "Prospective and current parents or guardians"
    - "Parent-controlled students"
    - "Educators"
    - "Administrators"
    - "Samantha Dodson as owner and final decision owner"
    - "Optional invited secondary guardians"
  platforms:
    - "Responsive web"
  primary_experience: "Help families discover an appropriate program, choose guided assistance or direct enrollment, and manage family participation in one trusted place."
  scope:
    - "Responsive public website and program discovery"
    - "Program catalog and details"
    - "Inquiry, tour, guidance, and assistance requests"
    - "Registration with program-specific external checkout handoff"
    - "Parent-controlled family accounts and student profiles"
    - "Family dashboard for enrollments, schedules, announcements, and resources"
    - "Educator assigned-program workspace"
    - "Administrator program operations"
    - "Program announcements and learning resources"
    - "Private Foundation Release beta using current website content"
  out_of_scope:
    - "Independent student accounts in the Foundation Release beta"
    - "Internal payment processing for the Foundation Release beta"
    - "Automated scholarship, discount, refund, credit, transfer, or other financial-policy decisions"
    - "Real-family activation before unresolved consent and child-data policy is approved"
  status: "MPS requirements approved for private beta design; authoritative implementation handoff remains policy-blocked"

identity:
  logo:
    direction: "Preserve and thoughtfully refine the existing Home School Haven identity and logo"
    status: approved
    canonical_source:
      name: "Home School Haven of SWFL original website logo"
      library_file_id: "libfile_1847dbb7f6cc81919312fd15c1988149"
      original_filename: "8aa5b524-c55b-4345-a44d-a9f0c54fc380.png"
      status: approved
    preservation_rules:
      - "Preserve the handwritten Homeschool wordmark, Haven of SWFL descriptor, house line art, and coral heart."
      - "Refinement may improve cleanup, spacing, lockups, and small-size legibility without replacing the recognizable identity."
      - "Do not redraw the logo through generative image output; use the supplied logo as the canonical identity asset."
  personality:
    - value: "calm"
      status: observed
    - value: "creative"
      status: observed
    - value: "relationship-centered"
      status: observed
    - value: "Christ-centered"
      status: approved_product_constraint
  brand_adjectives:
    - "boutique"
    - "warm"
    - "trusted"
    - "welcoming"
  emotional_response:
    - "Parents feel reassured and personally supported"
    - "Children feel welcomed without the product becoming childish"
    - "Educators feel organized and respected"
  visual_direction:
    value: "Warm boutique learning community with a balanced, naturally integrated Christ-centered identity"
    status: approved
  principles:
    - statement: "Creativity over conformity"
      source: MPS
      status: approved_product_principle
    - statement: "Curiosity over perfection"
      source: MPS
      status: approved_product_principle
    - statement: "Character over performance"
      source: MPS
      status: approved_product_principle
    - statement: "Community over competition"
      source: MPS
      status: approved_product_principle
    - statement: "A Haven, Not Just a Platform"
      source: MDS
      status: approved
    - statement: "Warmth With Clarity"
      source: MDS
      status: approved
    - statement: "Parent Trust Comes First"
      source: MDS
      status: approved
    - statement: "Creativity Within Calm Structure"
      source: MDS
      status: approved
    - statement: "Faith Expressed Through Character"
      source: MDS
      status: approved
  references:
    - "https://homeschoolhaven.org/"

