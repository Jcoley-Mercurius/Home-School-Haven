responsive:
  breakpoints: {mobile: "0–639px", tablet: "640–1023px", desktop: "1024–1439px", wide: "1440px and above"}
  rules:
    stacking:
      - "Program detail action rail moves below the identity summary and before long-form details on mobile"
      - "Dashboard overview grids collapse from multi-column to one prioritized feed"
      - "Forms stack labels and controls without compressing help or validation language"
    navigation:
      - "Public desktop navigation becomes a mobile menu while preserving a visible contextual conversion action"
      - "Portal desktop sidebar becomes a tablet rail and a maximum five-destination mobile bottom navigation"
      - "Secondary destinations move to the mobile account or More menu"
    sidebar:
      - "Catalog filters become an accessible filter drawer on tablet and mobile"
      - "Sticky detail rails become inline panels below 1024px"
    grid:
      - "Program grid uses 3 columns wide/desktop, 2 columns tablet, and 1 column mobile"
      - "Feature cards span 6 or 12 desktop columns and become full width on mobile"
      - "Operational tables transform to labeled record cards when column integrity cannot be preserved"
    typography:
      - "Use approved responsive values; do not uniformly scale every type role"
      - "Preserve 16px body text and readable line length on mobile"
    spacing:
      - "Page gutters change 32px to 24px to 16px"
      - "Section rhythm changes 80px to 64px to 48px"
    visibility:
      - "Never hide required enrollment, payment, consent, or privacy meaning to simplify mobile"
      - "Progressively disclose secondary metadata while keeping labels available"
    media:
      - "Program cards use 4:3 media; feature storytelling uses 16:9 or editorial crop"
      - "Images must crop safely without obscuring people, work, or learning context"
    touch:
      - "Maintain minimum 44x44 targets and at least 8px separation between adjacent actions"
      - "Use mobile bottom action bars only for contextual primary actions and preserve safe-area spacing"

patterns:
  landing: {applicability: required, status: approved, composition: "Editorial hero, trust/value band, featured programs, guidance, community story, CTA", responsive_behavior: "Narrative order preserved; two-column sections stack intentionally"}
  dashboard: {applicability: required, status: approved, composition: "Context header, next action, enrollment summary, schedule, announcements, resources", responsive_behavior: "Priority feed on mobile; bottom navigation"}
  search_results: {applicability: required, status: approved, composition: "Search, filters, result count, program grid/list, no-results guidance", responsive_behavior: "Filter drawer; single-column cards"}
  detail: {applicability: required, status: approved, composition: "Identity, verified facts, description, schedule, educator, status/action rail, related content", responsive_behavior: "Action/status moves above long content"}
  forms: {applicability: required, status: approved, composition: "Intro, progress when multi-step, grouped fields, contextual help, summary, safe actions", responsive_behavior: "One column; sticky mobile action only when appropriate"}
  authentication: {applicability: required, status: approved, composition: "Brand context, account form, recovery/help, privacy reassurance", responsive_behavior: "Full-width panel with 16px gutter"}
  empty: {applicability: required, status: approved, composition: "Warm explanation, one clear next action, optional quiet illustration", responsive_behavior: "Compact and centered without excessive vertical space"}
  error: {applicability: required, status: approved, composition: "Plain-language problem, preservation reassurance, recovery action, help route", responsive_behavior: "No lost actions or hidden details"}
  loading: {applicability: required, status: approved, composition: "Layout-preserving skeleton with announced progress where needed", responsive_behavior: "Matches final responsive composition"}
  custom:
    program_discovery: {applicability: required, status: approved, composition: "Browse, search, filter, compare, request guidance, or open details"}
    enrollment_handoff: {applicability: required, status: approved, composition: "Student selection, consent readiness, summary, explicit external checkout notice, return status"}
    waitlist: {applicability: required, status: approved, composition: "Program context, non-enrollment explanation, contact details, submit, received state"}
    consent: {applicability: required, status: approved, composition: "Owner-approved policy content, version/context, explicit acceptance, retained status"}
    assistance_request: {applicability: required, status: approved, composition: "Private supportive introduction, minimum necessary fields, manual-review expectation, received state"}
    educator_content_studio: {applicability: optional, status: approved, horizon: "Future LMS", composition: "Assigned-program selector, course outline, material editor, resource upload, draft/preview/review actions, authoring boundaries"}
    admin_operations: {applicability: required, status: approved, horizon: "Foundation Beta", composition: "Attention overview, program operations, quick actions, payment/consent/content states, recent activity, owner-authority reminder"}

visual_language:
  personality: "Warm boutique learning community; calm, creative, trusted, relationship-centered, and child-welcoming without being childish"
  density: "Comfortable and calm; operational screens may become moderately dense while preserving scanability"
  contrast: "Soft overall atmosphere with strong readable text and unmistakable interactive states"
  surface_philosophy: "Warm ivory canvas, white or warm-white content surfaces, botanical quiet panels, and occasional coral or gold highlights"
  border_philosophy: "Soft structural borders; avoid heavy boxes and excessive compartmentalization"
  shadow_philosophy: "Restrained elevation only where hierarchy or layering requires it"
  color_philosophy: "Botanical green provides trust and structure; coral carries inherited warmth; gold adds sparing heritage emphasis"
  typography_character: "Editorial warmth in storytelling paired with modern operational clarity"
  icon_character: "Simple, warm, rounded line work consistent with the logo's house illustration"
  whitespace_philosophy: "Generous breathing room that creates calm and communicates boutique care"

guidance:
  do:
    - {id: MDS-DO-001, area: identity, statement: "Preserve the recognizable logo and its heart-and-home warmth", rationale: "Maintains continuity and trust", status: approved}
    - {id: MDS-DO-002, area: composition, statement: "Use calm whitespace and clear hierarchy to guide families", rationale: "Reduces uncertainty and cognitive load", status: approved}
    - {id: MDS-DO-003, area: faith, statement: "Express faith naturally through values, language, imagery, and moments of encouragement", rationale: "Supports balanced Christ-centered identity", status: approved}
    - {id: MDS-DO-004, area: privacy, statement: "Make consent, student privacy, enrollment, waitlist, and payment distinctions explicit", rationale: "Protects family trust", status: approved}
  dont:
    - {id: MDS-DONT-001, area: identity, statement: "Do not replace or generatively redraw the canonical logo", rationale: "The supplied logo is authoritative", status: approved}
    - {id: MDS-DONT-002, area: visual_language, statement: "Do not make the interface childish, cartoon-heavy, overly rustic, or institutionally sterile", rationale: "Protects the warm boutique direction", status: approved}
    - {id: MDS-DONT-003, area: faith, statement: "Do not rely on repetitive religious decoration as a substitute for authentic values", rationale: "Preserves balanced expression", status: approved}
    - {id: MDS-DONT-004, area: accessibility, statement: "Do not use Logo Coral or Heritage Gold for normal-size text on light surfaces", rationale: "Those native accents do not meet required text contrast", status: approved}

accessibility:
  target: {value: "WCAG 2.2 AA", status: approved}
  contrast: "Minimum 4.5:1 for normal text, 3:1 for large text and meaningful non-text UI; decorative Logo Coral and Heritage Gold are not text colors on light surfaces"
  focus: "Visible 2px Coral 700 #A84248 focus ring with 2px offset; never remove focus without an equivalent"
  keyboard: "All interactive flows, navigation, dialogs, forms, enrollment, and dashboard actions must be keyboard operable"
  touch_targets: "Minimum 44x44 CSS pixels for primary touch interactions"
  motion: "Respect prefers-reduced-motion; motion supports orientation and must not be required for meaning"
  semantic_markup: "Use correct headings, landmarks, labels, lists, tables, buttons, links, and form associations"
  screen_reader: "Announce validation, loading, success, pending, blocked, waitlist, payment-handoff, and confirmation changes appropriately"
  image_alternatives: "Meaningful learning and program imagery requires useful alternative text; decorative botanical imagery uses empty alternatives"
  additional_rules:
    - "Enrollment, waitlist, external-payment handoff, payment status, consent, and assistance states must not rely on color alone."
    - "Student and family information must use privacy-aware presentation patterns."

