  elevation: {base: 0, card: 1, sticky: 2, overlay: 3}
icons:
  family: "Warm outlined icon language"
  implementation: "Final library selection deferred to MTS; visual treatment is authoritative"
  stroke_style: "1.75px rounded stroke with simple human geometry"
  fill_style: "Outline by default; selective filled status marks only"
  sizes: {small: "16px", standard: "20px", comfortable: "24px", feature: "32px"}
  custom_icon_rules:
    - "The house-and-heart identity motif may inspire illustrations but must not be copied into every component."
  usage_rules:
    - "Icons support labels; they do not replace critical enrollment, payment, consent, or assistance language."

components:
  button:
    applicability: required
    status: approved
    variants: [primary, secondary, quiet, text, destructive]
    sizes: [small_36, standard_44, large_52]
    states: [default, hover, focus, active, disabled, loading]
    specification:
      primary: "Forest 600 fill, white label; Forest 700 hover/active"
      secondary: "Warm White or transparent surface, Forest 700 label, Forest 600 border"
      quiet: "Forest 50 surface, Forest 700 label"
      text: "No container; Forest 700 label with directional icon when useful"
      destructive: "Error color reserved for destructive or irreversible actions"
      radius: "10px"
      minimum_touch_target: "44x44px"
  icon_button:
    applicability: required
    status: approved
    variants: [default, quiet, inverse, destructive]
    sizes: [standard_44, comfortable_48]
    states: [default, hover, focus, active, disabled, loading]
    specification:
      rule: "Every icon-only control requires an accessible name and tooltip where the meaning is not universal"
  input:
    applicability: required
    status: approved
    variants: [text, email, phone, password, date, search]
    sizes: [standard_44, comfortable_48]
    states: [default, hover, focus, filled, disabled, readonly, loading, success, warning, error]
    specification:
      label: "Persistent Manrope 600 label above the field"
      help: "Optional help text below; validation message replaces or follows help without layout ambiguity"
      focus: "2px Coral 700 ring with 2px offset"
      error: "Error icon, message, and border; never color alone"
  textarea:
    applicability: required
    status: approved
    variants: [standard, guided]
    sizes: [standard, large]
    states: [default, focus, filled, disabled, readonly, error]
  select:
    applicability: required
    status: approved
    variants: [single, multi]
    sizes: [standard_44, comfortable_48]
    states: [default, open, focus, selected, disabled, error, empty]
  checkbox:
    applicability: required
    status: approved
    variants: [standard, consent]
    sizes: [standard_20]
    states: [unchecked, checked, indeterminate, focus, disabled, error]
  radio:
    applicability: required
    status: approved
    variants: [standard, choice_card]
    sizes: [standard_20]
    states: [unselected, selected, focus, disabled, error]
  switch:
    applicability: optional
    status: approved
    variants: [standard]
    sizes: [standard]
    states: [off, on, focus, disabled]
    specification:
      rule: "Use only for settings that apply immediately; do not use for consent or enrollment commitments"
  search:
    applicability: required
    status: approved
    variants: [compact, full, filtered]
    sizes: [standard_44, comfortable_48]
    states: [empty, typing, results, no_results, loading, error]
  badge:
    applicability: required
    status: approved
    variants: [format, age_grade, category, private, role]
    sizes: [small, standard]
    states: [default, selected, removable, disabled]
    specification:
      rule: "Descriptive metadata uses quiet tonal styling and must not compete with enrollment status"
  status:
    applicability: required
    status: approved
    variants: [success, warning, error, info, neutral]
    sizes: [compact, standard]
    states: [default]
    specification:
      rule: "Always pair semantic color with an icon and explicit label"
  progress:
    applicability: required
    status: approved
    variants: [steps, bar, completion_ring]
    sizes: [compact, standard]
    states: [not_started, current, complete, blocked]
    specification:
      rule: "Use step progress for enrollment and setup; never imply payment confirmation from checkout handoff"
  card:
    applicability: required
    status: approved
    variants: [standard, interactive, selected, quiet, alerting]
    sizes: [compact, standard, feature]
    states: [default, hover, focus, selected, disabled, loading, empty]
  tabs:
    applicability: required
    status: approved
    variants: [underline, contained]
    sizes: [standard]
    states: [default, hover, focus, selected, disabled, overflow]
  alert:
    applicability: required
    status: approved
    variants: [success, warning, error, info, neutral]
    sizes: [inline, banner]
    states: [default, dismissible, persistent]
  dialog:
    applicability: required
    status: approved
    variants: [confirmation, form, information, destructive]
    sizes: [small, medium, large]
    states: [opening, open, submitting, success, error]
    specification:
      rule: "Destructive, consent, and financial dialogs require explicit action language and safe cancellation"
  table:
    applicability: required
    status: approved
    variants: [standard, roster, enrollment, payment_status]
    sizes: [comfortable, compact]
    states: [default, sortable, filtered, selected, loading, empty, error]
    specification:
      responsive: "Transform to labeled rows or cards on narrow screens; never force unreadable horizontal compression"
  navigation:
    applicability: required
    status: approved
    variants: [public_header, portal_sidebar, mobile_header, mobile_bottom_navigation, breadcrumbs, account_menu]
    sizes: [desktop, tablet, mobile]
    states: [default, current, hover, focus, expanded, collapsed]
    specification:
      public: "Logo, Programs, Calendar, About, Resources, Contact, Sign In, and clear enrollment/guidance actions"
      family: "Overview, Programs, Schedule, Announcements, Resources, Family, Account"
      educator: "Overview, Assigned Programs, Schedule, Rosters, Announcements, Resources"
      admin: "Overview, Programs, Enrollments, Families, Educators, Schedule, Communications, Reports, Settings"
  program_card:
    applicability: required
    status: approved
    variants: [catalog, featured, compact, enrolled]
    sizes: [grid, list, feature]
    states: [open, limited, waitlist, closed, seasonal, enrolled, loading]
    specification:
      content_order: [image_or_quiet_illustration, title, concise_summary, format, age_or_grade_when_verified, schedule_when_verified, price_when_verified, availability, action]
      truthful_content: "Missing facts remain unset or use Contact for details; never invent catalog data"
  enrollment_state:
    applicability: required
    status: approved
    variants: [open, limited_spaces, waitlist, pending_review, awaiting_external_payment, payment_pending_verification, enrolled, not_confirmed, closed, cancelled]
    sizes: [badge, inline_panel, detail_panel]
    states: [default, action_required, blocked, complete]
    specification:
      open: "Enrollment available"
      limited_spaces: "Limited availability; exact capacity only when verified"
      waitlist: "Join waitlist; do not imply enrollment"
      pending_review: "Request received; administrative review pending"
      awaiting_external_payment: "Continue to secure checkout; leaving the platform"
      payment_pending_verification: "Payment status pending verification; enrollment not yet confirmed"
      enrolled: "Enrollment confirmed only from an authoritative enrollment outcome"
      not_confirmed: "Clear neutral language; no success styling"
  payment_handoff:
    applicability: required
    status: approved
    variants: [external_checkout_notice, return_pending, status_unknown]
    sizes: [inline, dialog]
    states: [ready, leaving_site, returned, pending, error]
    specification:
      rule: "External handoff is never displayed as successful payment or confirmed enrollment"
  consent_state:
    applicability: required
    status: approved
    variants: [required, accepted, renewal_required, unavailable, blocked]
    sizes: [inline, panel, step]
    states: [default, action_required, accepted, expired, error]
    specification:
      rule: "Show policy name/version and acceptance state when known; unresolved policy language remains blocked"
  assistance_request:
    applicability: required
    status: approved
    variants: [quiet_link, supportive_panel, private_form]
    sizes: [inline, panel, full]
    states: [available, submitting, received, incomplete, unavailable]
    specification:
      rule: "Use dignified, private, non-stigmatizing language; requests are manually reviewed and never promise an outcome"
  family_student_selector:
    applicability: required
    status: approved
    variants: [avatar_tabs, dropdown, card_selector]
    sizes: [compact, standard]
    states: [default, selected, loading, empty, restricted]
    specification:
      rule: "Parent-controlled selection; expose only minimum appropriate student information"
  schedule_item:
    applicability: required
    status: approved
    variants: [class, event, deadline, cancelled, rescheduled]
    sizes: [compact, standard, agenda]
    states: [upcoming, today, completed, changed, cancelled]
  announcement:
    applicability: required
    status: approved
    variants: [general, program, urgent, educator_draft]
    sizes: [compact, standard, feature]
    states: [unread, read, pinned, scheduled, draft, archived]
  learning_resource:
    applicability: required
    status: approved
    variants: [document, link, video, activity, download]
    sizes: [compact, standard, feature]
    states: [available, new, viewed, downloading, unavailable, error]
  empty_state:
    applicability: required
    status: approved
    variants: [first_use, no_results, no_enrollments, no_schedule, no_resources]
    sizes: [inline, page]
    states: [default]
    specification:
      rule: "Use warm guidance and one clear next action; avoid playful illustrations that trivialize the situation"
  skeleton:
    applicability: required
    status: approved
    variants: [text, card, table, dashboard]
    sizes: [contextual]
    states: [loading]
    specification:
      rule: "Reserve layout without simulating real student or payment data"
  content_builder:
    applicability: optional
    status: approved
    variants: [course_outline, material_editor, content_block_picker, resource_upload, review_state]
    sizes: [desktop_workspace, responsive_editor]
    states: [draft, saved, review_required, submitting, submitted, error]
    specification:
      horizon: "Future LMS; not Foundation Beta behavior"
      authority: "Assigned programs only; no pricing or availability controls; direct public publishing is not granted"
      blocks: [text, image, file, link, video]
      policy_gap: "Exact future create, submit, review, and publish authority is deferred to future MPS evolution and is not Foundation Beta behavior"

