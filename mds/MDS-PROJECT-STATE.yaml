    forest_600: {name: "Forest 600", value: "#3F5C50", role: "Primary actions, navigation emphasis, and key brand structure", status: approved}
    forest_500: {name: "Forest 500", value: "#557467", role: "Secondary botanical emphasis and illustration detail", status: approved}
    forest_100: {name: "Forest 100", value: "#DDE7E1", role: "Selected surfaces and supportive panels", status: approved}
    forest_50: {name: "Forest 50", value: "#EFF4F1", role: "Quiet botanical background", status: approved}
  secondary:
    coral_700: {name: "Coral 700", value: "#A84248", role: "Accessible coral text, focus emphasis, and critical accent", status: approved}
    coral_500: {name: "Logo Coral", value: "#ED7D7C", role: "Canonical logo heart and decorative brand accent", status: approved}
    coral_100: {name: "Coral 100", value: "#F9E2E1", role: "Warm highlight surface", status: approved}
  accent:
