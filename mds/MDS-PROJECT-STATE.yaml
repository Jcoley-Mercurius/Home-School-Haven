  scale: {0: "0", 1: "4px", 2: "8px", 3: "12px", 4: "16px", 5: "20px", 6: "24px", 8: "32px", 10: "40px", 12: "48px", 16: "64px", 20: "80px", 24: "96px"}
  page_rules: {desktop_gutter: "32px", tablet_gutter: "24px", mobile_gutter: "16px"}
  section_rules: {desktop: "80px", tablet: "64px", mobile: "48px"}
  component_rules: {compact: "8px", standard: "16px", comfortable: "24px", grouped: "32px"}
shape:
  radius: {small: "6px", control: "10px", card: "14px", feature: "20px", pill: "999px"}
  borders: {default: "1px solid #E2E5E2", strong: "1px solid #C9CEC9", focus: "2px solid #A84248"}
  dividers: {default: "1px solid #E2E5E2"}
  shadows:
    subtle: "0 1px 2px rgba(31, 37, 34, 0.06)"
    card: "0 8px 24px rgba(31, 37, 34, 0.08)"
