    logo_ink: {name: "Logo Ink", value: "#292929", role: "Canonical logo linework", status: approved}
    ink_700: {name: "Ink 700", value: "#4F5954", role: "Secondary text", status: approved}
    ink_600: {name: "Ink 600", value: "#626B67", role: "Muted accessible text", status: approved}
    neutral_400: {name: "Neutral 400", value: "#9AA29E", role: "Disabled content and quiet iconography", status: approved}
    neutral_300: {name: "Neutral 300", value: "#C9CEC9", role: "Strong border and divider", status: approved}
    neutral_200: {name: "Neutral 200", value: "#E2E5E2", role: "Default border and divider", status: approved}
    ivory_100: {name: "Logo Ivory", value: "#F4F1EC", role: "Canonical brand canvas and warm page surface", status: approved}
    ivory_50: {name: "Warm White", value: "#FBF9F6", role: "Elevated warm surface", status: approved}
    white: {name: "White", value: "#FFFFFF", role: "High-clarity content surface", status: approved}
  semantic:
    success: {name: "Success", value: "#2F6B4F", role: "Confirmed and successful states", status: approved}
    warning: {name: "Warning", value: "#8A5A12", role: "Attention and pending states", status: approved}
    error: {name: "Error", value: "#A43C3C", role: "Error and blocked states", status: approved}
    info: {name: "Information", value: "#356A85", role: "Informational states", status: approved}
  surfaces:
    page: "#F4F1EC"
    elevated: "#FBF9F6"
    card: "#FFFFFF"
    quiet: "#EFF4F1"
    warm_highlight: "#F9E2E1"
  text:
    primary: "#1F2522"
    secondary: "#4F5954"
    muted: "#626B67"
    inverse: "#FFFFFF"
    link: "#31483F"
  borders:
    default: "#E2E5E2"
    strong: "#C9CEC9"
    focus: "#A84248"
  usage_rules:
    - "Forest 600 is the principal interactive color; Forest 700 is its hover and active partner."
    - "Logo Coral #ED7D7C is decorative and identity-bearing; do not use it for normal-size text on light surfaces."
    - "Coral 700 #A84248 is the accessible coral alternative for text, focus, and meaningful status emphasis."
    - "Heritage Gold #B38A42 is decorative; use Gold 700 #7A5A20 when the color must carry readable meaning."
    - "No state may rely on color alone; pair semantic color with language and iconography."

typography:
