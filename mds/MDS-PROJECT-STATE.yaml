    gold_500: {name: "Heritage Gold", value: "#B38A42", role: "Restrained decorative highlight", status: approved}
    gold_100: {name: "Heritage Gold 100", value: "#EFE3C8", role: "Warm highlight panel", status: approved}
  neutrals:
