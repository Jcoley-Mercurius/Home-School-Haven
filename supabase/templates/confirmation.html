<!--
  Email-address confirmation.

  `enable_confirmations = true`, so a provisioned account confirms its address
  before it is usable. There is no self-service sign-up (`enable_signup =
  false`), so this is reached only through an administrator-provisioned account.

  See `supabase/templates/recovery.html` for why the link is built from
  `{{ .TokenHash }}` rather than `{{ .ConfirmationURL }}`.
-->
<div
  style="
    font-family: Georgia, &quot;Times New Roman&quot;, serif;
    color: #1f2522;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px;
  "
>
  <h1 style="font-size: 24px; line-height: 1.3; margin: 0 0 16px">
    Confirm your email address
  </h1>

  <p
    style="
      font-family: Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      margin: 0 0 16px;
    "
  >
    Confirm this address to finish setting up your Home School Haven account:
  </p>

  <p style="margin: 0 0 24px">
    <a
      href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup&next=%2Faccount"
      style="
        font-family: Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 600;
        background-color: #3f5c50;
        color: #ffffff;
        padding: 14px 24px;
        border-radius: 10px;
        text-decoration: none;
        display: inline-block;
      "
      >Confirm my email address</a
    >
  </p>

  <p
    style="
      font-family: Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      color: #4f5954;
      margin: 0;
    "
  >
    This link works once and expires in one hour. If you were not expecting it,
    you can ignore this email.
  </p>
</div>
