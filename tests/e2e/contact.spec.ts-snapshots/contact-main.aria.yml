  - paragraph: Contact
  - heading "How can we support your family?" [level=1]
  - paragraph: Choose the path that best fits your question; Home School Haven will respond personally.
  - heading "What happens to your request" [level=2]
  - paragraph:
    - text: What you send is recorded privately and goes to Home School Haven’s administrators. A request for help with the cost of a class is seen only by them — never by an educator, and never in anything shared with other families. Nothing here decides anything about cost or enrollment. To reach us today, please call
