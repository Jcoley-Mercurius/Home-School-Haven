  - complementary "Authority and environment":
    - paragraph: This is a private beta environment with sample data. Continuing to external checkout is a handoff to Home School Haven’s payment provider — it is not payment confirmation, and payment activity is not confirmed enrollment.
    - paragraph: Samantha Dodson remains the final decision owner. Administrators hold delegated operational authority, and only an administrator or Samantha publishes program, price, availability, registration, or cancellation changes.
  - paragraph: Schedule, communication, report, and settings operations are not part of this review yet. They arrive in later slices, and no link to them is shown until they work.