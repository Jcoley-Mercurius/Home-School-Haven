      - listitem: Inquiries
  - heading "Inquiries" [level=1]
  - paragraph: Every request sent from the public site — guidance, visits, general questions, and help with the cost of a class — with who owns it and where it stands.
  - paragraph: Requests about cost are private, and nothing here replies for you
  - text: A request for help with the cost of a class is visible only to administrators. Educators cannot see any inquiry, and no part of it appears on a roster or in a program announcement. Moving an inquiry records where your review stands; it sends the family nothing, and it decides no discount, scholarship, or price. Replying is still yours to do, by email or phone.
  - status: 4 inquiries, newest first.
