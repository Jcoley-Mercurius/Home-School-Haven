    - paragraph: No family has been invited. A parent cannot create their own account — an invitation from this page is the only way one begins.
  - paragraph: Families control their own records
  - text: This directory is read-only. A parent or guardian adds, changes, and removes their family’s details and student profiles; an administrator cannot edit or delete them here. Enrollment states are changed on the Enrollments page, where each decision is recorded with a reason.
