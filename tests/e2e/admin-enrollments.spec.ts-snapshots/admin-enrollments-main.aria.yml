- main:
  - paragraph: Private beta · Sample data
  - navigation "Breadcrumb":
    - list:
      - listitem:
        - link "Operations":
          - /url: /admin
      - listitem: Enrollments
  - heading "Enrollments" [level=1]
  - paragraph: Every enrollment and its current authoritative state. Families see exactly the state and wording shown here.
  - paragraph: Payment is never confirmed on this platform
  - text: Checkout happens on Home School Haven’s external payment page. Leaving for it is not proof of payment, and payment activity is not confirmed enrollment. Confirming an enrollment here records an administrator’s decision — it verifies no payment and issues no refund, credit, or transfer.
  - form "Filter enrollments":
    - group "Enrollment state":
      - text: ""
      - radio "All states" [checked]
      - text: All states
      - radio "Awaiting checkout"
      - text: Awaiting checkout
      - radio "Pending review"
      - text: Pending review
      - radio "Payment verification pending"
      - text: Payment verification pending
      - radio "Waitlisted"
      - text: Waitlisted
      - radio "Enrolled"
      - text: Enrolled
      - radio "Payment failed — not confirmed"
      - text: Payment failed — not confirmed
      - radio "Cancelled"
      - text: Cancelled
      - radio "Blocked — not confirmed"
      - text: Blocked — not confirmed
    - text: Program
    - combobox "Program": All programs
    - button "Apply"
    - paragraph: "There is no name search here on purpose: a search term becomes part of the web address, and a student’s name must never travel in one."
