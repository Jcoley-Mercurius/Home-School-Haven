    status: approved
    release: "Foundation Release Beta"
    jobs: ["Manage programs, educators, schedules, enrollment, payments, rosters, communications, and website-linked content"]
    authority: "Operational authority delegated by the owner."
    restrictions: ["Does not replace the owner decision role", "Access must be role-appropriate and individually assigned"]
  - id: ACT-005
    name: "Public visitor or prospective parent"
    type: public_user
    status: approved
    release: "Foundation Release Beta"
    jobs: ["Understand Home School Haven", "Explore programs, educators, schedules, and pricing", "Request guidance or a visit", "Begin registration and payment"]
    authority: "May access only public information and public conversion paths."
    restrictions: ["Cannot access private family, student, educator, roster, or operational information"]
  - id: ACT-006
    name: "Owner administrator — Samantha Dodson"
    type: accountable_owner
    status: approved
    release: "Foundation Release Beta"
    jobs: ["Exercise final product and operational authority", "Control administrator access", "Approve public policy, pricing, programs, and launch progression", "Evaluate beta evidence"]
    authority: "Highest product and organization-level authority."
    restrictions: ["Owner credentials must not be shared"]
  - id: ACT-007
    name: "Invited secondary guardian"
    type: secondary_user
    status: approved_optional
    release: "Foundation Release Beta"
    jobs: ["View or help manage an invited family account within owner-approved permissions"]
    authority: "Receives access only through a primary parent invitation."
    restrictions: ["Must not gain access without explicit family authorization", "Exact beta inclusion is subject to scope priority and implementation complexity"]
  - id: ACT-008
    name: "Payment processor"
    type: affected_external_system
    status: observed
    release: "Foundation Release Beta"
    jobs: ["Process payment details through the existing or approved provider"]
    authority: "No Home School Haven product-policy authority."
    restrictions: ["Platform must not expose unnecessary child or family data to the provider"]

