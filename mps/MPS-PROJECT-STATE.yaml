workflows:
  - id: MPS-WFL-001
    name: "Program discovery and conversion"
    status: approved
    goal: "Help a prospective family identify an appropriate program and choose guided help or direct enrollment."
    actors: [ACT-005, ACT-004]
    trigger: "A public visitor explores Home School Haven or its programs."
    preconditions: ["Verified public program information is available"]
    main_path: ["Browse or filter programs", "Review program details", "Choose inquiry, tour, assistance, or registration path", "Submit the selected action"]
    alternate_paths: ["No matching program", "Program unavailable", "Visitor requests a visit or guidance"]
    states: [browsing, program_selected, inquiry_submitted, registration_started, completed]
    notifications: ["Notify administrator of submitted inquiry, tour, or assistance request"]
    owner: ACT-004
    completion: "The family receives confirmation and a clear next step."
    recovery: "Preserve entered information where appropriate and show a retry or alternate contact path."
  - id: MPS-WFL-002
    name: "Family account and student-profile onboarding"
    status: approved
    goal: "Establish a parent-controlled family account and minimum necessary student profiles."
    actors: [ACT-001, ACT-002, ACT-007]
    trigger: "A parent creates an account or begins an authenticated enrollment."
    preconditions: ["Parent can review required consent and privacy information"]
    main_path: ["Create and verify account", "Accept required consent", "Create family profile", "Add student profile", "Reach family-ready state"]
    alternate_paths: ["Duplicate email", "Incomplete profile", "Invite secondary guardian when enabled"]
    failure_paths: ["Verification expired", "Consent not accepted", "Unauthorized guardian-access attempt"]
    states: [account_pending, verified, consent_pending, family_incomplete, family_ready, blocked]
    owner: ACT-001
    completion: "The parent can use eligible family features and enroll a student."
    recovery: "Allow verification resend, safe completion later, and administrator support without bypassing consent."
  - id: MPS-WFL-003
    name: "Enrollment and existing-provider payment"
    status: approved
    goal: "Enroll an eligible student using the program's confirmation and capacity rules."
    actors: [ACT-001, ACT-002, ACT-004, ACT-008]
    trigger: "A parent selects a student and program for registration."
    preconditions: ["Family is ready", "Program registration is open", "Required program information is verified"]
    main_path: ["Select student", "Check program capacity and confirmation mode", "Complete registration", "Use existing-provider payment or approved test path", "Record result", "Show enrollment in family and administrative views"]
    alternate_paths: ["Administrator approval required", "Program full with waitlist", "Program full without waitlist"]
    failure_paths: ["Payment pending", "Payment failed", "Payment canceled", "Duplicate enrollment", "Stale capacity"]
    states: [started, approval_pending, payment_pending, waitlisted, confirmed, payment_failed, canceled, blocked]
    notifications: ["Notify family and administrator of confirmed, pending, waitlisted, failed, or canceled state"]
    owner: ACT-004
    completion: "Enrollment has one visible authoritative state and appears in the correct roster when confirmed."
    recovery: "Permit safe payment retry or administrative review without duplicate enrollment or double charging."
  - id: MPS-WFL-004
    name: "Discounted-class assistance"
    status: approved
    goal: "Let a family privately request support without automated eligibility decisions."
    actors: [ACT-005, ACT-001, ACT-004, ACT-006]
    trigger: "A prospective or current family submits an assistance request."
    preconditions: ["The request explains privacy and expected follow-up"]
    main_path: ["Submit private request", "Administrator reviews", "Administrator contacts family", "Request more information or determine next step", "Provide approved registration or payment path"]
    alternate_paths: ["More information required", "Assistance unavailable", "Different program recommended"]
    states: [submitted, under_review, awaiting_family, approved_path_provided, not_available, closed]
    notifications: ["Confirm receipt privately", "Notify only authorized administrators"]
    owner: ACT-006
    completion: "The family receives a private outcome or next step."
    recovery: "Allow authorized follow-up while preventing sensitive details from appearing in group communications."
  - id: MPS-WFL-005
    name: "Program administration and publishing"
    status: approved
    goal: "Maintain authoritative program information from creation through archival."
    actors: [ACT-003, ACT-004, ACT-006]
    trigger: "An administrator creates or changes a program offering."
    preconditions: ["Actor has program-management authority"]
    main_path: ["Create draft", "Add verified details, schedule, capacity, educator, pricing, and enrollment mode", "Review", "Publish", "Open enrollment", "Operate program", "Complete and archive"]
    alternate_paths: ["Full with waitlist", "Full without waitlist", "Registration closed", "Rescheduled", "Canceled"]
    states: [draft, review, published, enrollment_open, full, waitlist, closed, active, completed, canceled, archived]
    notifications: ["Notify affected families of approved material schedule, status, or cancellation changes"]
    owner: ACT-004
    completion: "Public, family, educator, and administrative program information is consistent."
    recovery: "Retain history, correct errors through authorized edits, and communicate material changes."
  - id: MPS-WFL-006
    name: "Educator program delivery"
    status: approved
    goal: "Let educators support assigned families and programs without authority over organization policy."
    actors: [ACT-003, ACT-004, ACT-001]
    trigger: "An educator is assigned to a program."
    preconditions: ["Educator account is active", "Program assignment exists"]
    main_path: ["View assigned schedule and roster", "Create resource or program announcement", "Publish within permitted scope", "Family views content"]
    alternate_paths: ["Draft retained", "Resource removed", "Educator reassigned"]
    failure_paths: ["Attempted unassigned-program access", "Unavailable or invalid resource"]
    states: [assigned, active, draft_content, published_content, reassigned, completed]
    notifications: ["Notify enrolled families when a permitted announcement is published"]
    owner: ACT-003
    completion: "Authorized enrolled families can access the published program content."
    recovery: "Block unauthorized access and let an administrator correct assignment or content state."
  - id: MPS-WFL-007
    name: "Family participation"
    status: approved
    goal: "Keep an enrolled family informed and connected to its programs."
    actors: [ACT-001, ACT-002, ACT-003, ACT-004]
    trigger: "A student has a confirmed or relevant pending enrollment."
    preconditions: ["Parent can access the family account"]
    main_path: ["View enrollment", "Review schedule", "Read announcements", "Access learning resources"]
    alternate_paths: ["Schedule change", "Cancellation notice", "Payment pending", "Waitlisted"]
    states: [upcoming, active, changed, payment_pending, waitlisted, canceled, completed]
    notifications: ["Present current state in dashboard", "Send email when enabled and appropriate"]
    owner: ACT-001
    completion: "The parent can identify the student's current program state and next action."
    recovery: "Provide administrator contact or required action for unresolved states."
  - id: MPS-WFL-008
    name: "Foundation beta review"
    status: approved
    goal: "Collect Samantha's evidence-based decisions before Complete Platform Launch scope."
    actors: [ACT-006, ACT-004]
    trigger: "The Foundation Release beta is ready for owner walkthrough."
    preconditions: ["Approved beta workflows can be demonstrated", "Known limitations are disclosed"]
    main_path: ["Walk through success signals", "Record feedback", "Classify issue or idea", "Approve disposition", "Update affected MPS state"]
    alternate_paths: ["Must-fix beta defect", "Launch requirement", "Next or Later idea", "Rejected change"]
    states: [not_reviewed, in_review, feedback_recorded, decision_pending, disposition_approved, review_complete]
    notifications: ["Record approved decisions and stale downstream dependencies"]
    owner: ACT-006
    completion: "Samantha approves the beta disposition and the next product-definition step."
    recovery: "Unresolved items remain explicit gaps; they do not silently enter launch scope."
business_rules:
  - {id: MPS-RUL-001, status: approved, condition: "A program accepts enrollment", behavior: "The program uses either instant confirmation or administrator approval as configured by an administrator.", owner: ACT-006, workflows: [MPS-WFL-003, MPS-WFL-005]}
  - {id: MPS-RUL-002, status: approved, condition: "A program reaches capacity", behavior: "The configured program state determines waitlist, closed, or other approved behavior; joining a waitlist does not collect payment unless Samantha later approves that policy.", owner: ACT-006, workflows: [MPS-WFL-003, MPS-WFL-005]}
  - {id: MPS-RUL-003, status: approved, condition: "An announcement or sensitive family matter is communicated", behavior: "Program announcements remain within authorized program scope; sensitive family matters are handled privately.", owner: ACT-006, workflows: [MPS-WFL-004, MPS-WFL-006, MPS-WFL-007]}
  - {id: MPS-RUL-004, status: approved, condition: "A cancellation, refund, credit, or transfer is requested in the beta", behavior: "An authorized administrator handles it manually under existing Home School Haven policy; the beta records status but does not decide or issue the outcome automatically.", owner: ACT-006, workflows: [MPS-WFL-003, MPS-WFL-007]}
