governance:
  decisions:
    - id: DEC-001
      status: approved
      statement: "Use the Mercurius Product System to define the upgraded website and learning platform before MDS, MTS, or implementation."
      approved_at: "2026-08-26"
    - id: DEC-002
      status: approved
      statement: "The initiative includes both an upgraded Home School Haven website and a learning platform."
      approved_at: "2026-08-26"
    - id: DEC-003
      status: approved
      statement: "Define both surfaces as one coordinated product ecosystem rather than unrelated projects."
      approved_at: "2026-08-26"
    - id: DEC-004
      status: approved
      statement: "Build toward a complete platform combining program management, blended learning for local families, and full online learning for remote families."
      approved_at: "2026-08-26"
    - id: DEC-005
      status: approved
      statement: "In the first release, parents control family accounts and student profiles while educators and administrators receive separate authenticated accounts; students do not sign in independently."
      approved_at: "2026-08-26"
    - id: DEC-006
      status: approved
      statement: "The upgraded website will provide a flexible enrollment journey supporting both guided lead capture and direct registration and payment."
      approved_at: "2026-08-26"
    - id: DEC-007
      status: approved
      statement: "The initial audience emphasis is existing Home School Haven programs, primarily elementary and middle-school learners."
      approved_at: "2026-08-26"
    - id: DEC-008
      status: approved
      statement: "Adopt the proposed Christ-centered product purpose as the foundational purpose statement."
      approved_at: "2026-08-26"
    - id: DEC-009
      status: approved
      statement: "Use the Foundation Release as a private beta for owner review; it is not the public launch, and the complete launch platform will be shaped by beta feedback."
      approved_at: "2026-08-26"
    - id: DEC-010
      status: approved
      statement: "The eventual online learning platform will support both live educator-led learning and self-paced learning."
      approved_at: "2026-08-26"
    - id: DEC-011
