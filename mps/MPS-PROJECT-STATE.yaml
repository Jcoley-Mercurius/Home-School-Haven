    name: "Primary parent or guardian"
    type: primary_user
    status: approved
    release: "Foundation Release Beta"
    jobs: ["Manage the family account", "Manage student profiles", "Discover and select programs", "Request guidance or enroll directly", "Pay", "View schedules and announcements", "Access enrolled resources"]
    authority: "Controls the family account, student profiles, enrollments, and family-visible information."
    restrictions: ["Cannot access another family", "Cannot grant student login in the beta", "Cannot change organization policy or program records"]
  - id: ACT-002
    name: "Student"
    type: affected_minor
    status: approved
    release: "Foundation Release Beta"
    jobs: ["Participate in enrolled programs", "Receive parent-mediated access to schedules, announcements, and learning resources"]
    authority: "Represented by a parent-controlled profile; no independent beta login."
    restrictions: ["No direct account authority", "No default collection of sensitive medical, behavioral, or accommodation data"]
  - id: ACT-003
    name: "Educator"
    type: operational_user
    status: approved
    release: "Foundation Release Beta"
    jobs: ["View assigned programs and schedules", "Access assigned rosters and appropriate student information", "Publish learning resources", "Draft or publish program-scoped announcements as permitted"]
