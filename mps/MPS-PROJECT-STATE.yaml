acceptance_criteria:
  - {id: MPS-ACC-001, status: approved, release: REL-BETA-001, requirement: MPS-REQ-001, statement: "Given a parent is creating a beta student profile, when the profile form is presented, then only approved minimum student fields are requested by default.", test_method: manual_and_automated}
  - {id: MPS-ACC-002, status: approved, release: REL-BETA-001, requirement: MPS-REQ-002, statement: "Given required authority affirmation or consent is missing, when a parent attempts enrollment, then enrollment is blocked with a clear unresolved action and no payment is initiated.", test_method: manual_and_automated}
  - {id: MPS-ACC-003, status: approved, release: REL-BETA-001, requirement: MPS-REQ-003, statement: "Given a parent accepts required consent, when the record is reviewed by an authorized administrator, then the accepted policy version and acceptance time are available.", test_method: manual_and_automated}
  - {id: MPS-ACC-004, status: approved, release: REL-BETA-001, requirement: MPS-REQ-005, statement: "Given owner policy confirmation is incomplete, when the private beta is reviewed, then all displayed student records are demonstrably sample or sanitized data.", test_method: manual_review}
  - {id: MPS-ACC-005, status: approved, release: REL-BETA-001, requirement: MPS-REQ-004, statement: "Given a public visitor or educator without assignment attempts to access private student or family information, when access is requested, then no private record or identifying content is disclosed.", test_method: security_and_manual}
  - {id: MPS-ACC-006, status: approved, release: REL-BETA-001, requirement: MPS-REQ-006, statement: "Given policy language has not been approved by Samantha, when the applicable experience is reviewed, then the product does not present invented policy or enable a policy-dependent live action.", test_method: policy_review}
  - {id: MPS-ACC-007, status: approved, release: REL-BETA-001, requirement: MPS-REQ-007, statement: "Verified public purpose, values, service area, contact, programs, and educators are reachable without authentication.", test_method: manual_and_automated}
  - {id: MPS-ACC-008, status: approved, release: REL-BETA-001, requirement: MPS-REQ-007, statement: "Missing or unverified content is not silently presented as authoritative.", test_method: manual}
  - {id: MPS-ACC-009, status: approved, release: REL-BETA-001, requirement: MPS-REQ-008, statement: "A published program shows every applicable approved field and current next action.", test_method: manual_and_automated}
  - {id: MPS-ACC-010, status: approved, release: REL-BETA-001, requirement: MPS-REQ-008, statement: "An empty program result provides guidance or contact rather than a dead end.", test_method: manual}
  - {id: MPS-ACC-011, status: approved, release: REL-BETA-001, requirement: MPS-REQ-009, statement: "Direct registration and relevant guided-help paths are distinguishable and available.", test_method: manual}
  - {id: MPS-ACC-012, status: approved, release: REL-BETA-001, requirement: MPS-REQ-010, statement: "A valid inquiry creates one administrative record and gives the family confirmation.", test_method: manual_and_automated}
  - {id: MPS-ACC-013, status: approved, release: REL-BETA-001, requirement: MPS-REQ-010, statement: "An assistance request is inaccessible to educators and unauthorized users.", test_method: security_and_manual}
  - {id: MPS-ACC-014, status: approved, release: REL-BETA-001, requirement: MPS-REQ-010, statement: "Failed or timed-out submission does not claim success and offers retry or alternate contact.", test_method: manual_and_integration}
  - {id: MPS-ACC-015, status: approved, release: REL-BETA-001, requirement: MPS-REQ-011, statement: "A verified unique parent identity creates one family account and can continue setup.", test_method: manual_and_automated}
  - {id: MPS-ACC-016, status: approved, release: REL-BETA-001, requirement: MPS-REQ-011, statement: "An existing identity does not create a duplicate family and receives recovery guidance.", test_method: manual_and_automated}
  - {id: MPS-ACC-017, status: approved, release: REL-BETA-001, requirement: MPS-REQ-011, statement: "Expired verification can be renewed and incomplete approved setup can be resumed safely.", test_method: manual_and_automated}
  - {id: MPS-ACC-018, status: approved, release: REL-BETA-001, requirement: MPS-REQ-012, statement: "Invalid family, student, consent, program, capacity, or registration state blocks payment and identifies the blocker.", test_method: manual_and_automated}
  - {id: MPS-ACC-019, status: approved, release: REL-BETA-001, requirement: MPS-REQ-012, statement: "A valid registration for an approval-required program becomes approval-pending rather than confirmed or paid.", test_method: manual_and_automated}
  - {id: MPS-ACC-020, status: approved, release: REL-BETA-001, requirement: MPS-REQ-012, statement: "A full waitlist-enabled program creates a waitlisted state without collecting payment.", test_method: manual_and_automated}
  - {id: MPS-ACC-021, status: approved, release: REL-BETA-001, requirement: MPS-REQ-013, statement: "Payment initiation uses the approved provider or test path and remains pending until a trustworthy result exists.", test_method: integration_and_manual}
  - {id: MPS-ACC-022, status: approved, release: REL-BETA-001, requirement: MPS-REQ-014, statement: "Family and admin views show one consistent enrollment and payment state with the correct next action.", test_method: integration_and_automated}
  - {id: MPS-ACC-023, status: approved, release: REL-BETA-001, requirement: MPS-REQ-014, statement: "Retry after timeout or stale response creates no duplicate confirmed enrollment or unintended duplicate charge.", test_method: integration_and_automated}
  - {id: MPS-ACC-024, status: approved, release: REL-BETA-001, requirement: MPS-REQ-015, statement: "The parent dashboard distinguishes each student's program, schedule, state, announcements, resources, and actions.", test_method: manual_and_automated}
  - {id: MPS-ACC-025, status: approved, release: REL-BETA-001, requirement: MPS-REQ-015, statement: "Rescheduled, canceled, waitlisted, pending, and completed states replace stale guidance without erasing history.", test_method: manual_and_automated}
  - {id: MPS-ACC-026, status: approved, release: REL-BETA-001, requirement: MPS-REQ-016, statement: "Allowed program lifecycle transitions appear consistently and retain attributable material history.", test_method: manual_and_automated}
  - {id: MPS-ACC-027, status: approved, release: REL-BETA-001, requirement: MPS-REQ-016, statement: "An educator without admin authority cannot publish a price, open registration, or cancel a program.", test_method: security_and_manual}
  - {id: MPS-ACC-028, status: approved, release: REL-BETA-001, requirement: MPS-REQ-017, statement: "A confirmed student appears once in the correct roster and the assigned educator sees only approved fields.", test_method: automated_and_security}
  - {id: MPS-ACC-029, status: approved, release: REL-BETA-001, requirement: MPS-REQ-018, statement: "An educator can access assigned program data and is denied unassigned private program data.", test_method: security_and_automated}
  - {id: MPS-ACC-030, status: approved, release: REL-BETA-001, requirement: MPS-REQ-019, statement: "Current approved announcement and resource state reaches enrolled families only.", test_method: manual_and_security}
  - {id: MPS-ACC-031, status: approved, release: REL-BETA-001, requirement: MPS-REQ-020, statement: "Material program and enrollment changes remain consistent across relevant views with an observable next action.", test_method: end_to_end}
  - {id: MPS-ACC-032, status: approved, release: REL-BETA-001, requirement: MPS-REQ-022, statement: "The beta walkthrough records every success signal, applicable accessibility evidence, attributable material changes, and classified owner feedback.", test_method: manual_walkthrough_and_audit}
