releases:
  - id: REL-BETA-001
    name: "Foundation Release Beta"
    status: requirements_approved_policy_blocked
    audience: "Samantha Dodson and invited reviewers"
    intent: "Demonstrate the ecosystem foundation, validate workflows, and gather owner feedback before public launch."
    public_launch: false
    scope_refs: [BETA-001, BETA-002, BETA-003, BETA-004, BETA-005, BETA-006, BETA-007]
    priority_model: "must | should | could | wont_this_release"
    payment_boundary: "Use the current program-specific external checkout URLs or approved test paths during private review. The beta does not rebuild payment processing and must not treat handoff as successful payment without a trustworthy result."
    content_boundary: "Use current Home School Haven website course and program listings as the approved import source. Normalize presentation without changing facts; flag structural ambiguity or anomalies and do not invent missing fields."
    validation_signals: [SIG-BETA-001, SIG-BETA-002, SIG-BETA-003, SIG-BETA-004, SIG-BETA-005, SIG-BETA-006, SIG-BETA-007, SIG-BETA-008]
  - id: REL-LAUNCH-001
    name: "Complete Platform Launch"
    status: proposed
    audience: "Local in-person families and remote online families"
    intent: "Launch the complete ecosystem after beta feedback, including program management, blended local learning, and live plus self-paced online learning."
    dependencies: [REL-BETA-001, "Samantha Dodson feedback", "Gate 2-7 approvals"]

