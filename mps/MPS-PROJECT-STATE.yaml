project:
  name: "Home School Haven Learning Platform"
  description: "Upgrade the public Home School Haven website and define a connected learning platform for its homeschool community."
  product_type: "Approved hybrid ecosystem: public website, program management portal, blended learning hub, and full online learning platform"
  business_stage: "Existing in-person homeschool community; digital ecosystem preparing a private Foundation Release beta"
  geography:
    - "Cape Coral, Florida"
    - "Southwest Florida"
  platforms:
    - "Responsive web"
  decision_owners:
    - name: "Samantha Dodson"
      role: "Home School Haven owner and final product decision owner"
      status: approved
  context:
    - id: CTX-001
      status: observed
      statement: "Home School Haven currently offers enrichment classes, hands-on workshops, small-group learning experiences, and community support for homeschool families."
      evidence: "https://homeschoolhaven.org/"
    - id: CTX-002
      status: observed
      statement: "The organization presents itself as a boutique, calm, creative, Christ-centered learning community."
      evidence: "https://homeschoolhaven.org/"
    - id: CTX-003
      status: observed
      statement: "Current offerings include multi-week enrichment, readiness, art, sewing, gardening, history, summer programs, and special events."
      evidence: "https://homeschoolhaven.org/classes"
    - id: CTX-004
      status: observed
      statement: "The current website uses separate class, calendar, contact, and external payment experiences."
      evidence: "Public website review on 2026-08-26"
    - id: CTX-005
      status: approved
      statement: "Treat the public website and learning platform as one product ecosystem with distinct public, family, educator, and administrative experiences."
    - id: CTX-006
      status: observed
      statement: "Current offerings are commonly sold by specific class, multi-week session, program, term, or summer week through direct Register & Pay or Pay Now actions."
      evidence: "https://homeschoolhaven.org/classes and https://homeschoolhaven.org/summer-series reviewed 2026-08-26"
    - id: CTX-007
      status: observed
      statement: "The current contact experience explicitly invites families to request support or help with discounted classes."
      evidence: "https://homeschoolhaven.org/contact reviewed 2026-08-26"
    - id: CTX-008
      status: observed
      statement: "The public privacy policy says payment details are processed through third-party platforms and child-related information is collected with parental consent for program participation."
      evidence: "https://homeschoolhaven.org/privacy-policy reviewed 2026-08-26"
    - id: CTX-009
      status: approved
      statement: "The courses, programs, and other information currently published on the Home School Haven website are current and authorized as the Foundation Release beta content-import source."
      evidence: "Product-definition collaborator confirmation on 2026-08-26"
    - id: CTX-010
      status: approved
      statement: "The current website's program-specific external checkout procedure is sufficient for the Foundation Release private beta."
      evidence: "Product-definition collaborator confirmation on 2026-08-26"
  constraints:
    - "The product serves children and must require explicit decisions for parental consent, child-data handling, permissions, safety, and public visibility."
    - "The product identity should preserve Home School Haven's Christ-centered values and warm boutique-community positioning."
    - "The Foundation Release is a private beta for owner review, not the public platform launch."
    - "The complete launch scope must incorporate Samantha Dodson's beta feedback before approval."
  non_goals: []

purpose:
  statement: "Home School Haven gives homeschool families one trusted, Christ-centered place to discover programs, enroll, manage their family's participation, access meaningful learning, and stay connected—while giving educators and administrators the tools to operate and expand both local and online programs."
  problem_statement: "Homeschool families currently navigate disconnected experiences for discovering programs, registering and paying, tracking schedules, receiving communication, and accessing learning resources. At the same time, Home School Haven needs a unified way to manage families, students, educators, programs, enrollment, and learning so it can serve its local community well and expand to remote families without losing its personal, Christ-centered character."
  value_proposition: "Home School Haven brings trusted community, Christ-centered support, flexible enrollment, program management, and meaningful learning into one connected experience. Families can move naturally from discovering the right opportunity to enrolling, participating, and learning—whether locally, through live online classes, or at their own pace—without navigating disconnected systems or losing the personal support that makes Home School Haven distinctive."
  principles:
    - "Creativity over conformity"
    - "Curiosity over perfection"
    - "Character over performance"
    - "Community over competition"
  guardrails:
    - "Do not weaken child safety, family privacy, parental authority, or community trust in pursuit of convenience or growth."
    - "Do not replace or silently change existing pricing, scholarship, discount, payment, refund, or cancellation policy without Samantha Dodson's explicit approval."

outcomes:
  - {id: OUT-FAM-001, type: user, beneficiary: "Prospective and current families", status: approved, statement: "Quickly understand which programs fit their children and choose guided assistance or direct enrollment.", direction: improve, baseline: unknown, owner: "Samantha Dodson"}
  - {id: OUT-FAM-002, type: user, beneficiary: "Parents and guardians", status: approved, statement: "Manage multiple children through one parent-controlled family account.", direction: simplify, baseline: unknown, owner: "Samantha Dodson"}
  - {id: OUT-FAM-003, type: user, beneficiary: "Enrolled families", status: approved, statement: "See enrollments, schedules, announcements, and learning resources in one trusted place.", direction: centralize, baseline: unknown, owner: "Samantha Dodson"}
  - {id: OUT-FAM-004, type: user, beneficiary: "Local and remote families", status: approved, statement: "Participate in local, blended, live-online, and self-paced learning as the platform expands.", direction: expand_access, baseline: unknown, owner: "Samantha Dodson"}
  - {id: OUT-EDU-001, type: user, beneficiary: "Educators", status: approved, statement: "Understand assigned programs and schedules and access accurate rosters and relevant student information.", direction: improve_clarity, baseline: unknown, owner: "Samantha Dodson"}
  - {id: OUT-EDU-002, type: user, beneficiary: "Educators", status: approved, statement: "Communicate with enrolled families, share resources, and deliver learning with less disconnected coordination work.", direction: reduce_effort, baseline: unknown, owner: "Samantha Dodson"}
  - {id: OUT-ADM-001, type: business, beneficiary: "Home School Haven administrators", status: approved, statement: "Manage programs, schedules, educators, families, and enrollment centrally while maintaining accurate public and private information.", direction: centralize_and_improve_accuracy, baseline: unknown, owner: "Samantha Dodson"}
  - {id: OUT-ADM-002, type: business, beneficiary: "Home School Haven administrators", status: approved, statement: "Reduce repetitive administrative work and enrollment errors while improving visibility into interest, capacity, enrollment, and participation.", direction: reduce_and_improve, baseline: unknown, owner: "Samantha Dodson"}
  - {id: OUT-BIZ-001, type: business, beneficiary: "Home School Haven", status: approved, statement: "Expand from a local program community into blended and remote learning without losing family trust, personal support, or community quality.", direction: responsible_growth, baseline: unknown, owner: "Samantha Dodson"}
  - {id: OUT-BIZ-002, type: business, beneficiary: "Home School Haven", status: approved, statement: "Help more well-matched families move from interest to appropriate participation through flexible conversion paths.", direction: improve_conversion_quality, baseline: unknown, owner: "Samantha Dodson"}
actors:
