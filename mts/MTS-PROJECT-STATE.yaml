architecture:
  environments: [local_development, private_preview, production]
  runtime: {selection: "Next.js App Router with TypeScript", status: approved, repository_compatibility: unverified}
  deployment: {selection: Vercel, status: approved, commercial_plan: "Vercel Pro target", account_owner: "Josh Coley"}
  data: {selection: "Supabase Postgres and private Storage", status: approved, system_of_record: "programs, operations, enrollment, roles, announcements, and learning resources"}
  identity: {selection: "Supabase Auth", status: approved, student_accounts: "not permitted in Foundation Release"}
  authorization: {selection: "server-derived roles plus Supabase Row Level Security", status: approved, posture: "deny by default"}
  tenancy: {}
  services:
    - {name: Resend, capability: "transactional and authentication email", status: approved, domain_authentication: "SPF, DKIM, and DMARC required"}
    - {name: Sanity, capability: "public editorial CMS", status: deferred, note: "Not required for Foundation Release; must never own enrollment, roster, progress, child data, or access-control truth"}
    - {name: PostHog, capability: "public analytics, feature flags, and browser error visibility", status: approved_staged, privacy_profile: "public routes only; cookieless; person_profiles never; session replay disabled"}
    - {name: Cloudflare Turnstile, capability: "form and authentication bot protection", status: approved, timing: "before public or real-family activation"}
    - {name: Cloudflare R2, capability: "secondary recovery copy for Supabase Storage objects", status: approved, timing: "before real-family activation"}
  integrations: []
  apis: []
  events: []
  jobs: []
  observability: {foundation: "Vercel runtime logs", approved_addition: "privacy-scrubbed PostHog browser error tracking", deferred: "Sentry unless deeper server tracing is evidenced"}
  analytics: {approved_staged: "PostHog Free for anonymous public funnels and feature flags after core stability", prohibited_foundation_capture: "authenticated routes, PII, child/family identifiers, form contents, checkout details, and session replay"}
  ai: {}
  reliability: {}
  recovery: {database: "Supabase Pro daily backups before real-family activation", files: "separate scheduled object copy required because database backups exclude Storage objects"}

security:
  actors: ["public visitor", "primary guardian", "secondary guardian", "educator", "administrator", "Samantha as owner", "external payment system", "service identities"]
  roles: ["public", "parent_guardian", "educator", "administrator", "owner"]
  assets: ["accounts", "family records", "student profiles", "rosters", "enrollment states", "consent evidence", "assistance requests", "learning resources", "audit history"]
  data_classes:
    - {name: "Public content", sensitivity: low}
    - {name: "Account and contact data", sensitivity: moderate}
    - {name: "Minor/family data", sensitivity: high}
    - {name: "Consent evidence", sensitivity: high}
    - {name: "Private assistance requests", sensitivity: high}
    - {name: "Payment and enrollment status references", sensitivity: high}
    - {name: "Security credentials and service secrets", sensitivity: critical}
  trust_boundaries:
    - "Public browser to public application surface"
    - "Authenticated browser to server-side application boundary"
    - "Application server to identity, data, file, notification, analytics, and observability services"
    - "Application to external checkout provider"
    - "Privileged administrator/owner operations to protected data and audit controls"
  secret_controls:
    - "Keep private credentials server-side and out of source, clients, logs, analytics, URLs, and artifacts."
  access_controls:
    - "Derive identity and roles from authenticated server context; deny by default."
    - "Enforce family ownership, program assignment, and privileged operations server-side."
  privacy_controls:
    - "Minimize minor/family data and block real-family activation until owner-approved policy exists."
    - "Keep private assistance data out of public content, analytics, and ordinary educator access."
  ai_controls: []
  operational_controls:
    - "Separate development, private-beta preview, and production environments."
    - "Test authorization, recovery, replay/idempotency, backup, and restore controls before readiness claims."

