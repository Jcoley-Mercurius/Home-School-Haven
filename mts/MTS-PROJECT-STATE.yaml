project:
  name: "Home School Haven Learning Platform"
  description: "A connected Christ-centered ecosystem combining the public Home School Haven website with family, educator, and administrative experiences."
  product_type: "Responsive public website, program management portal, blended learning hub, and future online learning platform"
  users:
    - "Prospective and current parents or guardians"
    - "Parent-controlled students with no independent Foundation Beta login"
    - "Educators limited to assigned programs, rosters, announcements, and resources"
    - "Administrators with delegated operational authority"
    - "Samantha Dodson as owner and final decision owner"
    - "Optional invited secondary guardians"
  platforms: ["Responsive web"]
  business_stage: "Existing in-person homeschool community preparing a private Foundation Release beta"
  scope:
    - "Responsive public website and program discovery"
    - "Program catalog and detail pages"
    - "Inquiry, tour, guidance, and private assistance requests"
    - "Registration using existing program-specific external checkout handoff"
    - "Parent-controlled family accounts and minimum-data student profiles"
    - "Family dashboard for enrollment, schedules, announcements, and resources"
    - "Educator assigned-program workspace"
    - "Administrator program operations"
    - "Program announcements and learning resources"
    - "Private Foundation Release beta using current approved website content"
  out_of_scope:
    - "Independent student accounts in Foundation Release Beta"
    - "Internal payment processing in Foundation Release Beta"
    - "Automated scholarship, discount, refund, cancellation, credit, transfer, or other financial-policy decisions"
    - "Real-family activation before child-data, consent, retention, and deletion policy approval"
    - "Full educator Course Builder in Foundation Release Beta; retained as future-platform direction"
  constraints:
    - "Preserve approved MPS product scope, roles, rules, acceptance criteria, and release boundaries."
    - "Preserve locked MDS v1.0 visual, interaction, responsive, and WCAG 2.2 AA decisions."
    - "External checkout initiation is not successful payment, and payment activity is not confirmed enrollment without an authoritative outcome."
    - "Use sample or sanitized family and student data until applicable policy is approved."
    - "Only Samantha-approved policy and financial language may be used."
    - "Prefer the smallest coherent architecture that satisfies approved requirements."
    - "Primary implementation team is Josh Coley working with Codex; recommendations must minimize operational burden and provide deterministic implementation guidance."
    - "Target Samantha-review build in 2–3 days when possible and no later than 5 days."
    - "Target recurring software cost below $100 per month and explore credible free tiers first."
  scale_assumptions:
    - "Fewer than 100 families during the first year."
    - "Foundation Release is a private Samantha-review build before real-family activation."
  regulatory_context:
    - "Product serves minors in Florida and requires explicit parental authority, privacy, consent, retention, deletion, and role-access controls."
    - "No compliance certification or precise statutory implementation claim has been established; legal/policy authority remains with MPS and Samantha."

